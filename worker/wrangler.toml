# Cloudflare Worker cho tính năng "Chọn shop". CHƯA deploy.
# Bí mật nhập bằng: npx wrangler secret put <TÊN> (không ghi vào file này).
#   OWNER_PASSWORD, SESSION_SECRET, TOKEN_ENC_KEY (32 byte base64),
#   SHOPEE_PARTNER_ID, SHOPEE_PARTNER_KEY, TIKTOK_APP_KEY, TIKTOK_APP_SECRET, (tùy chọn) TIKTOK_SERVICE_ID
name = "timikid-shop-connect"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGIN = "https://timikid-vn.github.io"
FRONTEND_URL = "https://timikid-vn.github.io/"
# SHOPEE_HOST = "https://openplatform.sandbox.test-stable.shopee.sg"   # bỏ # để dùng sandbox Shopee

[[kv_namespaces]]
binding = "SHOPS"
id = "THAY_BANG_ID_KV_SAU_KHI_TAO"   # npx wrangler kv namespace create SHOPS
