<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tính Lãi Lỗ Shopee & TikTok Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="hero"><div class="wrap">
  <h1>Tính Lãi Lỗ <span>Shopee</span> & <span class="tt">TikTok Shop</span></h1>
  <p>Tiền về, lãi lỗ và giá hòa vốn — tính ngay.</p>
</div></header>
<main class="wrap grid">
  <section class="col">
    <div class="card">
      <div class="toprow">
        <div class="plat" id="platform" role="radiogroup" aria-label="Sàn">
          <button data-v="shopee" title="Shopee" aria-label="Shopee"><svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="9" fill="#ee4d2d"/><path d="M10.5 12.5c0-3.2 2.4-5.5 5.5-5.5s5.5 2.3 5.5 5.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M7.5 12.5h17l-1.3 12a2 2 0 0 1-2 1.8H10.8a2 2 0 0 1-2-1.8z" fill="#fff"/><text x="16" y="23.6" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#ee4d2d">S</text></svg><span>Shopee</span></button>
          <button data-v="tiktok" title="TikTok Shop" aria-label="TikTok Shop"><svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="9" fill="#111"/><g transform="translate(6.5 6.5) scale(.8)"><path fill="#25f4ee" transform="translate(-.8 -.6)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.940-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.030-2.020-1.190-3.440-3.370-3.650-5.710-.020-.5-.030-1-.010-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#fe2c55" transform="translate(.8 .6)" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.090 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/><path fill="#fff" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.150-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></g></svg><span>TikTok</span></button>
        </div>
        <button type="button" id="shopOpen" class="shop-btn" title="Chọn shop đã kết nối">🏪<span>Chọn shop</span></button>
        <label class="mall"><span>Shop Mall</span><span class="switch"><input type="checkbox" id="mallToggle"/><span></span></span></label>
      </div>
      <div class="field-lbl">Ngành hàng <span class="muted" id="catCount"></span> <span id="catBadge" class="badge" hidden></span></div>
      <div class="catfield">
        <button type="button" id="catOpen" class="cat-trigger"><span id="catLabel">Chọn ngành hàng</span><i>›</i></button>
        <div class="suffix rate-in" id="rateBox" hidden><input id="commissionRate" inputmode="decimal" aria-label="Phí cố định %"/><i>%</i></div>
      </div>
      <small id="catNote" class="muted"></small>
    </div>
    <div class="card">
      <div class="two">
        <label>Giá bán<div class="suffix"><input class="money" id="price" inputmode="numeric" placeholder="0"/><i>₫</i></div></label>
        <label>Giá vốn<div class="suffix"><input class="money" id="cost" inputmode="numeric" placeholder="0"/><i>₫</i></div></label>
        <div id="opexBox"></div>
        <div id="adsBox"></div>
        <label id="ordersBox">Số đơn dự kiến / tháng<div class="suffix"><input class="money" id="ordersPerMonth" inputmode="numeric" placeholder="VD: 500"/><i>đơn</i></div><small class="muted" id="ordersHint">Để tính lãi/lỗ cả tháng</small></label>
      </div>
    </div>
    <details class="card fold" id="feesPanel">
      <summary><b>Phí sàn & thuế</b><span id="feeSummary" class="muted"></span></summary>
      <div class="fold-body"><div id="fees"></div>
        <div class="fold-foot"><span class="muted">⚠️ = chưa xác minh</span><button id="resetFees" class="link">↺ Mặc định</button></div></div>
    </details>
  </section>
  <section class="col sticky">
    <div class="card result" id="result"></div>
    <details class="card fold" id="bdPanel" open><summary><b>Chi tiết phí</b><span class="muted">từng dòng như màn hình sàn</span></summary><table id="breakdown"></table></details>
    <details class="card fold"><summary><b>Nguồn biểu phí</b><span class="muted">tra cứu 17/10/2026</span></summary><ul id="sources" class="muted"></ul>
      <p class="muted">Sàn có thể thay đổi — hãy đối chiếu Kênh Người Bán.</p></details>
  </section>
</main>
<button type="button" id="mbar" class="mbar" aria-label="Xem kết quả"></button>
<dialog id="shopDialog" class="cat-dialog shop-dialog" aria-label="Chọn shop">
  <div class="dlg-head"><b>Chọn shop</b><button type="button" id="shopClose" class="dlg-x" aria-label="Đóng">✕</button></div>
  <div id="shopBody"></div>
</dialog>
<dialog id="catDialog" class="cat-dialog" aria-label="Chọn ngành hàng">
  <div class="dlg-head"><b>Chọn ngành hàng <span class="muted" id="catCount2"></span></b><button type="button" id="catClose" class="dlg-x" aria-label="Đóng">✕</button></div>
  <input id="catSearch" type="search" placeholder="🔍 Tìm ngành (gõ không dấu cũng được): sua bau, ao so mi..." autocomplete="off" />
  <div id="catCols" class="cat-cols"></div>
  <div class="dlg-foot"><div id="catCrumb" class="cat-crumb"></div><p id="catHint" class="cat-hint" hidden></p></div>
</dialog>
<script type="module" src="/src/main.js"></script>
</body></html>
